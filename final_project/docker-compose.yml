x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Mq6x3n2Z0WOmlRj0MFBIxj1PQ1HR6bYjY=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__SECRET_KEY=supersecretkey123
    - TARGET_DB_HOST=postgres
    - TARGET_DB_PORT=5432
    - TARGET_DB_NAME=delivery
    - TARGET_DB_USER=delivery_user
    - TARGET_DB_PASSWORD=delivery_pass
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

services:
  # Основная БД для нормализованных таблиц и витрин
  postgres:
    image: postgres:15
    container_name: delivery_postgres
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery"]
      interval: 5s
      retries: 10

  # БД для метаданных Airflow
  airflow-db:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  # pgAdmin для удобства проверки данных
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: delivery_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Инициализация Airflow (миграция БД + создание пользователя + соединение)
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow connections add delivery_pg --conn-type postgres --conn-host postgres --conn-port 5432 --conn-schema delivery --conn-login delivery_user --conn-password delivery_pass || true
    restart: "no"

  # Веб-сервер Airflow
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Планировщик Airflow
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  airflow-db-data:
  airflow-logs:
