version: "3.9"

services:
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    command: uvicorn main:app --host 0.0.0.0 --port 8888
    restart: always

  streamlit:
    build:
      context:  ./frontend
      dockerfile: Dockerfile
    ports:
      - "8889:8889"
    command: streamlit run app.py --server.port=8889 --server.address=0.0.0.0
    depends_on:
      - fastapi
    restart: always